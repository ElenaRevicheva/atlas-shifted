/** Server-generated "why" strings are English templates — translate the known patterns. */
function trWhy(s){
  if(LANG!=='es'||!s) return s||'';
  return String(s).replace(/saturation (\d+)%/g,'saturación $1%').replace(/(\d+) advertisers?/g,'$1 anunciantes')
    .replace(/(\d+) new in 7d/g,'$1 nuevos en 7 días').replace(/(\d+) launched ≤30d/g,'$1 lanzados ≤30 días')
    .replace(/(\d+)% of lane/g,'$1% del carril').replace(/adjacent to heating/g,'adyacente al carril caliente').replace(/co-occurrence/g,'co-ocurrencia');
}
const label=(v)=>String(v||'').replace(/_/g,' ');

function assetSrc(path,generatedAt){
  if(!path) return '';
  return path+(generatedAt?'?v='+encodeURIComponent(String(generatedAt).slice(0,19)):'');
}
function confLabel(score){ return score>=70?t('confHigh'):score>=40?t('confMed'):t('confLow'); }

/** Lanes measured in the last 14 days, GEO/AEO first (server: fresh_verticals). */
function freshList(d){ return (d&&d.fresh_verticals||[]).map(x=>x.vertical); }
function boardDate(d,v){ const b=(d&&d.board||[]).find(x=>x.vertical===v); return b&&b.snapshot_date||''; }

/** Today's move: GEO/AEO when it has a brief, else the best fresh ENTER, else the best fresh lane. Never a July lane. */
function pickDefaultVertical(d){
  const vs=(d&&d.brief&&d.brief.verticals)||[];
  const fresh=new Set(freshList(d));
  const pool=fresh.size?vs.filter(v=>fresh.has(v.vertical)):vs;
  if(pool.some(v=>v.vertical===GEO)) return GEO;
  const enter=pool.filter(v=>v.move&&v.move.state==='ENTER').sort((a,b)=>(b.move.score||0)-(a.move.score||0));
  if(enter.length) return enter[0].vertical;
  return ([...pool].sort((a,b)=>((b.move&&b.move.score)||0)-((a.move&&a.move.score)||0))[0]||{}).vertical||'';
}

function buildExportText(vertical){
  const brief=ATLAS_DATA&&ATLAS_DATA.brief; const concepts=(ATLAS_DATA&&ATLAS_DATA.concepts)||{};
  const v=((brief&&brief.verticals)||[]).find(x=>x.vertical===vertical);
  const c=concepts[vertical];
  if(!v) return '';
  const m=v.move; const cc=(c&&c.concept)||{};
  const tr=(c&&c.tracking)||{};
  const trackLines=tr.concept_id?['','── TRACKING (wire into ad + landing URL) ──','concept_id: '+tr.concept_id,'utm_campaign: '+(tr.utm_campaign||''),
    'utm_content: '+(tr.utm_content||''),'utm_source: '+(tr.utm_source||'meta'),'utm_medium: '+(tr.utm_medium||'paid'),'Landing URL: '+(tr.landing_url||'')]:[];
  return ['ATLAS CAMPAIGN EXPORT · '+(brief.snapshot_date||SNAPSHOT),'Lane: '+vertical,'',
    'Campaign:',cc.concept_name||(m.state+' '+m.angle),'','Audience:',label(vertical)+' · angle '+label(m.angle),'',
    'Hook:',cc.hook||'—','Headline:',cc.headline||'—','Primary text:',cc.primary_text||'—','',
    'Visual:',(c&&c.asset&&c.asset.image_file)||cc.scene_concept||'','CTA:',cc.cta||'—','',
    'Landing angle:',m.state+' '+m.angle+' — '+m.why,'','Why Atlas picked it:',m.why,
    ((c&&c.grounding_evidence)||[]).slice(0,2).map(e=>'• '+e.advertiser+': "'+String(e.excerpt).slice(0,100)+'…"').join('\n'),
    ...trackLines].join('\n');
}
function downloadExport(vertical){
  const text=buildExportText(vertical); if(!text) return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
  a.download='atlas-campaign-'+vertical+'-'+(SNAPSHOT||'export')+'.txt';
  a.click(); URL.revokeObjectURL(a.href);
}
function showHeroNote(msg){ const el=$('heroNote'); el.textContent=msg||''; el.style.display=msg?'block':'none'; }

function renderHero(d,vertical){
  const brief=d&&d.brief;
  if(!brief||!brief.verticals||!brief.verticals.length){ $('hero').style.display='none'; return; }
  const fresh=freshList(d); const freshSet=new Set(fresh);
  const sel=$('heroVertical');
  const opt=(v)=>'<option value="'+esc(v)+'">'+esc(label(v))+(boardDate(d,v)?' · '+esc(boardDate(d,v)):'')+'</option>';
  const freshOpts=fresh.filter(v=>brief.verticals.some(x=>x.vertical===v));
  const older=brief.verticals.map(v=>v.vertical).filter(v=>!freshSet.has(v));
  sel.innerHTML=freshOpts.map(opt).join('')+(older.length?'<optgroup label="'+esc(t('olderLanes'))+'">'+older.map(opt).join('')+'</optgroup>':'');
  if(!vertical) vertical=pickDefaultVertical(d);
  sel.value=vertical;
  sel.onchange=()=>{ showHeroNote(''); renderHero(ATLAS_DATA,sel.value); };
  $('heroView').onclick=()=>{
    const v=sel.value; showHeroNote('');
    const c=ATLAS_DATA&&ATLAS_DATA.concepts&&ATLAS_DATA.concepts[v];
    const el=document.getElementById('concept-'+v);
    if(el){ const det=el.closest('details'); if(det) det.open=true; el.scrollIntoView({behavior:'smooth',block:'start'}); if(!(c&&c.concept&&c.concept.headline)) showHeroNote(t('heroNoteGen')); return; }
    showHeroNote(t('heroNoteNone'));
  };
  $('heroExport').onclick=()=>downloadExport(sel.value);
  const row=brief.verticals.find(v=>v.vertical===vertical);
  if(!row||!row.move){ $('hero').style.display='none'; return; }
  const m=row.move;
  $('heroRec').innerHTML='<span class="badge '+esc(m.state)+'" style="margin-right:8px">'+esc(m.state)+'</span>'+esc(label(m.angle));
  $('heroConf').textContent=confLabel(m.score)+' ('+m.score+'/100)';
  $('heroWhy').textContent=trWhy(m.why)||'—';
  $('heroActV').textContent=t(m.state==='ENTER'?'actEnter':m.state==='WATCH'?'actWatch':m.state==='AVOID'?'actAvoid':'actStable');
  showHeroNote(vertical===GEO&&m.state!=='ENTER'&&vertical===pickDefaultVertical(d)?t('focusLane'):'');
  $('hero').style.display='block';
}

function sparkSvg(history){
  if(!history||!history.length) return '<svg class="spark" viewBox="0 0 56 22"><text x="4" y="14" fill="#6b7280" font-size="8">—</text></svg>';
  const pts=history.map((h,i)=>((history.length===1?28:(i/(history.length-1))*52+2)+','+(20-(h.score/100)*18))).join(' ');
  return '<svg class="spark" viewBox="0 0 56 22"><polyline fill="none" stroke="#edb867" stroke-width="1.5" points="'+pts+'"/></svg>';
}

  add(tot.revenue,'revenue','$'+(+tot.revenue||0).toFixed(2));
  if(tot.roas!=null) rows.push('<div class="prow"><b>ROAS</b> '+tot.roas+'×</div>');
  if(tot.cpa!=null) rows.push('<div class="prow"><b>CPA</b> $'+tot.cpa+'</div>');
  if(!rows.length) return '';
  const n=hs.deals!=null?hs.deals:(Number(hs.client)||0);

}

  const inGallery=(Skin.EXAMPLES||[]).some(x=>x.id===c.vertical);
  const media=inGallery?('<a class="evl" href="#exEyebrow">'+t('inExamples')+'</a>'):(c.video&&c.video.video_file
    ?('<video class="casset" src="'+esc(assetSrc(c.video.video_file,vidAt))+'" controls muted loop playsinline preload="none" poster="'+esc(assetSrc((c.asset&&c.asset.image_file)||'',imgAt))+'"></video><div class="evl">'+visCap(t('genVideoLab'),c.video.model)+'</div>')
    :(c.asset&&c.asset.image_file
      ?('<img class="casset" src="'+esc(assetSrc(c.asset.image_file,imgAt))+'" alt="" loading="lazy"><div class="evl">'+visCap(t('genStillLab'),c.asset.model)+'</div>')
      :'<div class="note">'+t('assetPending')+'</div>'));
  const row=(k,v)=>v?'<div class="row"><b>'+t(k)+':</b> '+esc(v)+'</div>':'';
  return '<div class="card concept" id="concept-'+esc(c.vertical)+'">'+
    '<div class="k">'+esc(label(c.vertical))+(mv.angle?' · '+(mv.state==='ENTER'?t('openWindow'):esc(mv.state||''))+': '+esc(label(mv.angle))+' ('+mv.score+'/100)':'')+(c.heating_lane?(' · '+t('adjHeating')+' '+esc(label(c.heating_lane))):'')+'</div>'+
    (IS_OWNER()?'':'<div class="draftnote">'+t('draftCopy')+'</div>')+
    '<h3>'+esc(cc.concept_name||label(c.vertical))+'</h3>'+(cc.emotion?'<div class="em">'+t('owns')+': '+esc(cc.emotion)+'</div>':'')+
    media+row('hook',cc.hook)+row('headline',cc.headline)+row('body',cc.primary_text)+row('scene',cc.scene_concept)+row('cta',cc.cta)+
    (muts?('<div class="row"><b>'+t('mutations')+':</b></div><div class="mutgrid">'+muts+'</div>'):'')+
    (ev?('<div class="evl">'+t('grounded')+': '+ev+'</div>'):'')+perfHtml(c)+trackHtml(c)+conceptShipHtml(c, shipCfg)+'</div>';
}
function conceptPendingHtml(vertical, move){
  const mv=move?(' · '+t('moveLab')+' '+esc(move.state)+' '+esc(label(move.angle))):'';
  return '<div class="card concept concept-pending" id="concept-'+esc(vertical)+'"><div class="k">'+esc(label(vertical))+mv+'</div><h3>'+t('pendingH')+'</h3><p class="pending-msg">'+t('pendingP')+'</p></div>';
}
const hasCopy=(c)=>!!(c&&c.concept&&(c.concept.headline||c.concept.hook));

/** Live lanes first (focus, then fresh). Older campaigns with real copy go under a fold.
    The 7 shipped creatives do NOT depend on this — they are the Examples gallery above. */
function renderConceptSection(d, focusVertical){
  const concepts=d.concepts||{}, shipCfg=d.ship||{};
  const briefByV={}; for(const v of ((d.brief&&d.brief.verticals)||[])) briefByV[v.vertical]=v;
  const live=[...new Set([focusVertical,...freshList(d)].filter(Boolean))];
  const html=live.map(v=>concepts[v]?conceptCardHtml(concepts[v],shipCfg):conceptPendingHtml(v,briefByV[v]&&briefByV[v].move));
  const older=Object.keys(concepts).filter(v=>!live.includes(v)&&hasCopy(concepts[v]));
  if(older.length) html.push('<details class="older"><summary>'+esc(t('olderCampaigns'))+' ('+older.length+')</summary>'+older.map(v=>conceptCardHtml(concepts[v],shipCfg)).join('')+'</details>');
  return html.join('')||'<div class="loading">—</div>';
}

let refreshPollTimer=null;
function scheduleRefreshPoll(d){
  if(refreshPollTimer){ clearInterval(refreshPollTimer); refreshPollTimer=null; }
  if(d&&d.pipeline&&d.pipeline.in_progress){
    refreshPollTimer=setInterval(()=>{
      fetch(atlasUrl()).then(r=>r.json()).then(nd=>{ render(nd); if(!nd.pipeline||!nd.pipeline.in_progress){ clearInterval(refreshPollTimer); refreshPollTimer=null; } }).catch(()=>{});
    },20000);
  }
}

function setTrackRunning(running,lab){
  const btn=$('scanTrack'); scanBusy=running; btn.disabled=running; btn.textContent=lab||(running?t('working'):t('trackBtn'));
}
function scanFeed(stage,msg,cls){
  const el=$('scanFeed'); el.style.display='block';
  const d=document.createElement('div'); d.innerHTML='<span class="'+(cls||'ok')+'">'+esc(stage)+'</span> · '+esc(msg);
  el.appendChild(d); el.scrollTop=el.scrollHeight;
}
function scanFinish(ok){ setTrackRunning(false); if(ok){ $('scanTrack').textContent=t('added'); setTimeout(()=>{ $('scanTrack').textContent=t('trackBtn'); },4000); } }
function stageLabel(stage){
  if(stage==='capture'||stage==='register') return t('stCapture');
  if(stage==='classify') return t('stClassify'); if(stage==='brief') return t('stBrief'); if(stage==='concept') return t('stConcept');
  return t('addingRadar');
}
function renderTrackedList(d){
  const custom=d.tracked_verticals||[], el=$('trackedList');
  if(!custom.length||!IS_OWNER()){ el.style.display='none'; return; }
  el.style.display='block';
  el.innerHTML='<div>'+t('trackedTitle')+' <span style="color:var(--ink-45)">'+t('trackedCron')+'</span></div><div class="chips">'+
    custom.map(v=>{ const on=(d.board||[]).some(b=>b.vertical===v.id); return '<span class="chip">'+esc(v.label)+(on?'':' <small>'+t('trackedPending')+'</small>')+'</span>'; }).join('')+'</div>';
}
/* Owner only. The public never starts a capture — there is no ?track=1 auto-run any more. */
function runTrack(){
  if(scanBusy||!IS_OWNER()) return;
  const v=$('scanQ').value.trim(); if(!v) return;
  setTrackRunning(true,t('addingRadar')); $('scanFeed').innerHTML='';
  scanFeed('start',t('addingRadar'));
  const es=new EventSource(withToken('api/atlas/track?vertical='+encodeURIComponent(v)));
  es.onmessage=(m)=>{
    let e; try{e=JSON.parse(m.data);}catch{return;}
    scanFeed(e.stage,e.message||'', e.stage==='error'?'bad':'ok');
    if(e.stage&&e.stage!=='error'&&e.stage!=='done') setTrackRunning(true,stageLabel(e.stage));
    if(e.stage==='done'){
      es.close(); scanFinish(true);
      fetch(atlasUrl()).then(r=>r.json()).then(render).then(()=>{ const el=document.getElementById('concept-'+(e.vertical_id||'')); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); });
    }
    if(e.stage==='error'){ es.close(); scanFinish(false); }
  };
  es.addEventListener('close',()=>{ es.close(); if(scanBusy) scanFinish(false); });
  es.onerror=()=>{ if(scanBusy) scanFeed('error','stream closed','bad'); es.close(); scanFinish(false); };
}

function shipFeed(vertical, stage, msg, cls){
  const el=document.getElementById('shipfeed-'+vertical); if(!el) return;
  el.classList.add('show');
  const d=document.createElement('div'); d.innerHTML='<span class="'+(cls||'ok')+'">'+esc(stage)+'</span> · '+esc(msg);
  el.appendChild(d); el.scrollTop=el.scrollHeight;
}
function setShipButtons(disabled, activeVertical){
  document.querySelectorAll('.shipbtn').forEach(btn=>{ btn.disabled=disabled; if(disabled&&btn.dataset.v===activeVertical) btn.textContent=t('generating'); });
}
function finishShipSuccess(d, vertical, partial, videoNote){
  ATLAS_DATA=d;
  $('concepts').innerHTML=renderConceptSection(d, vertical);
  bindShipButtons(); setShipButtons(false);
  const card=document.getElementById('concept-'+vertical);
  if(card){
    if(partial&&!((d.concepts||{})[vertical]||{}).video) card.insertAdjacentHTML('afterbegin','<div class="ship-warn">'+esc(videoNote||'Video step failed. Still image is live.')+'</div>');
    card.scrollIntoView({behavior:'smooth',block:'start'});
  }
}
/** Mobile SSE drops (screen sleep) while the server keeps rendering — poll until the asset lands. */
function pollShipAfterDisconnect(vertical, ctx){
  const startMs=Date.now(), MAX_MS=660000, INTERVAL=8000;
  shipFeed(vertical,'poll',t('reconnect'),'ok');
  async function attempt(){
    if(ctx.shipDoneRef.done) return;
    if(Date.now()-startMs>MAX_MS){ shipFeed(vertical,'error','stream closed','bad'); shipBusyVertical=''; setShipButtons(false); return; }
    try{
      const d=await (await fetch(atlasUrl())).json();
      const c=(d.concepts||{})[vertical]||{};
      const hasAssetNow=!!(c.asset&&c.asset.image_file), hasVideoNow=!!(c.video&&c.video.video_file);
      if(hasVideoNow&&!ctx.hadVideo){ ctx.shipDoneRef.done=true; shipBusyVertical=''; finishShipSuccess(d, vertical, false, ctx.videoNote); return; }
      if(ctx.stage==='all'&&hasAssetNow&&!ctx.hadAsset) shipFeed(vertical,'poll',t('stillReady'),'ok');
    }catch{}
    setTimeout(attempt, INTERVAL);
  }
  attempt();
}
function runShip(vertical){
  if(shipBusyVertical||!vertical||!IS_OWNER()) return;
  const c=ATLAS_DATA&&ATLAS_DATA.concepts&&ATLAS_DATA.concepts[vertical];
  const hasAsset=!!(c&&c.asset&&c.asset.image_file), hasVideo=!!(c&&c.video&&c.video.video_file);
  const stage=hasAsset&&!hasVideo?'video':'all';
  shipBusyVertical=vertical; setShipButtons(true, vertical);
  const feedEl=document.getElementById('shipfeed-'+vertical); if(feedEl) feedEl.innerHTML='';
  shipFeed(vertical,'start',stage==='video'?'Animating 5s video…':'Rendering still, then video…','ok');
  const shipDoneRef={done:false}; let videoNote='';
  const es=new EventSource(withToken('api/atlas/ship?vertical='+encodeURIComponent(vertical)+'&stage='+stage));
  es.onmessage=(m)=>{
    let e; try{e=JSON.parse(m.data);}catch{return;}
    if(e.stage==='video'&&(e.partial||e.message)) videoNote=e.message||videoNote;
    shipFeed(vertical, e.stage, e.message||'', e.stage==='error'?'bad':'ok');
    if(e.stage==='done'){
      shipDoneRef.done=true; es.close(); shipBusyVertical='';
      const partial=e.video_status==='partial'||(!e.has_video&&hasAsset);
      fetch(atlasUrl()).then(r=>r.json()).then(d=>finishShipSuccess(d, vertical, partial, videoNote));
    }
    if(e.stage==='error'){ shipDoneRef.done=true; es.close(); shipBusyVertical=''; setShipButtons(false); }
  };
  const lost=()=>{ es.close(); if(!shipDoneRef.done&&shipBusyVertical===vertical) pollShipAfterDisconnect(vertical,{stage,hadAsset:hasAsset,hadVideo:hasVideo,videoNote,shipDoneRef}); };
  es.addEventListener('close',lost);
  es.onerror=()=>{ if(!shipDoneRef.done) lost(); };
}
function bindShipButtons(){ document.querySelectorAll('.shipbtn').forEach(btn=>{ btn.onclick=()=>runShip(btn.dataset.v); }); }

$('scanTrack').onclick=runTrack;
$('scanQ').addEventListener('keydown',e=>{ if(e.key==='Enter'&&IS_OWNER()) runTrack(); });
const qParam=URLP.get('q'); if(qParam) $('scanQ').value=qParam;
if(URLP.get('track')==='1'){ // old WHITESPACE links land on the request form
  history.replaceState(null,'',qParam?'atlas.html?q='+encodeURIComponent(qParam):'atlas.html');
  setTimeout(()=>$('scan').scrollIntoView({behavior:'smooth',block:'start'}),300);
}

async function render(d){
  ATLAS_DATA=d;
  SNAPSHOT=d.snapshot_date||'';
  paintScanBox();
  const pipe=d.pipeline||{}, refreshing=!!pipe.in_progress;
  const fresh=freshList(d);
  const snapLabel=refreshing?((pipe.expected_snapshot_date||'today')+' ↻'):(d.snapshot_date||'—');
  // Days tracked = days since the FIRST capture (25 Jun 2026), counted to today in Panamá: it grows by itself.
  const since=d.first_snapshot_date||'2026-06-25';
  let today=''; try{ today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Panama'}).format(new Date()); }catch(e){ today=new Date().toISOString().slice(0,10); }
  const daysTracked=Math.max(0,Math.round((Date.parse(today+'T00:00:00Z')-Date.parse(since+'T00:00:00Z'))/864e5));
  $('stats').innerHTML=[[t('stDays'),daysTracked,'days',t('stDaysTip')(since,d.distinct_days||0)],[t('stAds'),d.total_rows||0,'ads'],[t('stVerts'),fresh.length||(d.board||[]).length,'lanes'],[t('stSnap'),snapLabel]]
    .map(([l,n,key,tip],i)=>'<div class="stat'+((i===3&&refreshing)?' refreshing':'')+'"'+(tip?' title="'+esc(tip)+'"':'')+'>'+
      (key?'<span class="n" data-count="'+(+n||0)+'" data-key="'+key+'">0</span>':'<span class="n">'+esc(String(n))+'</span>')+
      '<span class="l">'+esc(l+(refreshing&&i===3?t('stRefreshing'):''))+'</span></div>').join('');
  Skin.countUp($('stats'),LANG);
  const banner=$('refreshBanner');
  if(pipe.stale_reason){ banner.textContent=pipe.stale_reason; banner.classList.add('show'); }
  else if(d.stale){ banner.textContent=t('stale')(d.snapshot_date||'—',d.snapshot_age_days!=null?d.snapshot_age_days:'?'); banner.classList.add('show'); }
  else { banner.textContent=''; banner.classList.remove('show'); }
  scheduleRefreshPoll(d);

  $('shrug').textContent=(d.brief&&d.brief.resilience)||'⌐ Atlas shifted — multi-tier LLM failover armed.';
  const focus=pickDefaultVertical(d);
  renderHero(d, focus);
  renderTrackedList(d);

  // Intelligence: iterate the intelligence lanes themselves, live ones first (not the first 3 alphabetical).
  const intel=d.intelligence||{};
  const freshSet=new Set(fresh);
  const ivs=[...(intel.verticals||[])].sort((a,b)=>(freshSet.has(b.vertical)?1:0)-(freshSet.has(a.vertical)?1:0)).slice(0,4);
  $('intel').innerHTML=ivs.map(iv=>{
    const wc=iv.wait_cost, hl=iv.half_life;
    const pills=(wc?('<span class="pill '+(wc.verdict==='BUILD NOW'?'now':wc.verdict==='WAIT'?'wait':'avoid')+'">'+esc(wc.verdict)+'</span>'):'')+
      (hl?('<span class="pill fresh">~'+hl.est_days_remaining+t('halfLife')+' · '+hl.opportunity_remaining_pct+t('room')+'</span>'):'')+
      (boardDate(d,iv.vertical)?'<span class="datepill'+(freshSet.has(iv.vertical)?' fresh':'')+'">'+esc(boardDate(d,iv.vertical))+'</span>':'');
    const absent=(iv.absent_universe||[]).slice(0,2).map(a=>'<div class="absent"><b>'+t('absent')+' · '+esc(label(a.angle_id))+'</b> — '+esc(a.opportunity)+(a.adjacent_heat?' ('+t('demandNearby')+': '+esc(a.adjacent_heat)+')':'')+'</div>').join('');
    return '<div class="card vcard"><div class="vname">'+esc(label(iv.vertical))+'</div><div class="intelrow">'+pills+'</div>'+(wc?('<div class="note">'+t('waitCost')+': '+esc(wc.reason)+'</div>'):'')+absent+'</div>';
  }).join('')||'<div class="note">'+t('intelPending')+'</div>';

  // Board: live lanes (≤14 days) first, the rest folded. History calls run in parallel.
  const briefByV={}; for(const v of ((d.brief&&d.brief.verticals)||[])) briefByV[v.vertical]=v;
  const histOf=async(v,a)=>{ try{ const r=await fetch('api/atlas/history?vertical='+encodeURIComponent(v)+'&angle='+encodeURIComponent(a)); return (await r.json()).history||[]; }catch{ return []; } };
  const board=[...(d.board||[])].sort((a,b)=>(fresh.indexOf(a.vertical)<0?99:fresh.indexOf(a.vertical))-(fresh.indexOf(b.vertical)<0?99:fresh.indexOf(b.vertical)));
  const cards=await Promise.all(board.map(async v=>{
    const mv=briefByV[v.vertical];
    const moveTxt=mv&&mv.move?(t('moveLab')+' → '+esc(mv.move.state)+' '+esc(label(mv.move.angle))+' ('+mv.move.score+'/100)'):'';
    const isFresh=freshSet.has(v.vertical);
    const hs=await Promise.all(v.angles.map(a=>isFresh?histOf(v.vertical,a.angle_id):Promise.resolve([])));
    const lanes=v.angles.map((a,i)=>'<div class="lane" data-v="'+esc(v.vertical)+'" data-a="'+esc(a.angle_id)+'" data-d="'+esc(v.snapshot_date||'')+'">'+
      '<span class="badge '+esc(a.window_state)+'">'+esc(a.window_state)+'</span>'+
      '<span class="angle">'+esc(label(a.angle_id))+' <span class="b">'+a.distinct_advertisers+' adv · '+esc(a.signal_basis)+(a.adjacency_note?(' · '+esc(trWhy(a.adjacency_note))):'')+'</span></span>'+
      sparkSvg(hs[i])+'<span class="satbar"><span class="satfill" style="width:'+pct(a.saturation)+'%"></span></span><span class="score">'+pct(a.window_score)+'</span></div>').join('');
    return {fresh:isFresh, html:'<div class="card vcard"><div class="vhead"><span class="vname">'+esc(label(v.vertical))+' <span class="datepill'+(isFresh?' fresh':'')+'">'+esc(v.snapshot_date||'')+'</span></span><span class="vmove">'+moveTxt+'</span></div>'+lanes+'</div>'};
  }));
  const boardEl=$('board');
  const live=cards.filter(c=>c.fresh).map(c=>c.html).join(''), old=cards.filter(c=>!c.fresh).map(c=>c.html).join('');
  boardEl.innerHTML=(live||'')+(old?'<details class="older"><summary>'+esc(t('olderLanes'))+'</summary>'+old+'</details>':'')||'<div class="loading">'+t('noRadar')+'</div>';
  if(!board.length) boardEl.innerHTML='<div class="loading">'+t('noRadar')+'</div>';
  boardEl.querySelectorAll('.lane').forEach(el=>el.onclick=()=>openEvidence(el.dataset.v, el.dataset.a, el.dataset.d));
  if((d.distinct_days||0)<2) boardEl.insertAdjacentHTML('beforeend','<div class="note">'+t('sparkNote')+'</div>');

  $('concepts').innerHTML=renderConceptSection(d, focus);
  bindShipButtons();

  const mem=intel.memory||[];
  $('memory').innerHTML=mem.length?mem.slice(0,12).map(m=>'<div class="memory">'+esc(m.snapshot_date)+' · '+esc(label(m.vertical))+' · ENTER <b>'+esc(label(m.angle_id))+'</b> ('+Math.round(m.window_score*100)+'/100)</div>').join(''):'<div class="note">'+t('memNone')+'</div>';
}

function setLang(l){ LANG=l; try{localStorage.setItem('atlas_lang',l)}catch{} applyStaticLang(); if(ATLAS_DATA) render(ATLAS_DATA); }
$('langEN').onclick=()=>setLang('en');
$('langES').onclick=()=>setLang('es');
applyStaticLang();
if(!window.__wsFwd) fetch(atlasUrl()).then(r=>r.json()).then(render).catch(e=>{ $('board').innerHTML='<div class="loading">'+t('failed')+': '+esc(e.message)+'</div>'; });
Skin.backdrop(['ws-night','ws-city-night-grid','ws-casco-skyline','ws-medellin-cathedral','ws-banking-towers','ws-monserrate','ws-panama-skyline','ws-city-night-towers']);
Skin.music('media/atlas-music');
Skin.whatsapp({page:'atlas',prefill:{en:'Hi Elena — I saw the AIdeazz Atlas radar and I’d like to talk.',es:'Hola Elena — vi el radar Atlas de AIdeazz y me gustaría conversar.'}});
Skin.hubspot();
Skin.footer('atlas');
</script>

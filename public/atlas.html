  window.__wsFwd = 1;
  var de = document.documentElement; de.style.visibility = 'hidden';
  setTimeout(function () { de.style.visibility = ''; }, 4000);   // if the move fails, the page shows itself
  var s = q.toString();
  location.replace('https://aideazz.xyz/atlas' + (/atlas\.html$/.test(u.pathname) ? '' : '/finder') + (s ? '?' + s : '') + u.hash);

function confLabel(score){ return score>=70?t('confHigh'):score>=40?t('confMed'):t('confLow'); }

/** Lanes measured in the last 14 days, GEO/AEO first (server: fresh_verticals). */
function freshList(d){ return (d&&d.fresh_verticals||[]).map(x=>x.vertical); }
function boardDate(d,v){ const b=(d&&d.board||[]).find(x=>x.vertical===v); return b&&b.snapshot_date||''; }

/** Today's move: GEO/AEO when it has a brief, else the best fresh ENTER, else the best fresh lane. Never a July lane. */
function pickDefaultVertical(d){
  const vs=(d&&d.brief&&d.brief.verticals)||[];
  const fresh=new Set(freshList(d));
  const pool=fresh.size?vs.filter(v=>fresh.has(v.vertical)):vs;
  if(pool.some(v=>v.vertical===GEO)) return GEO;
  const enter=pool.filter(v=>v.move&&v.move.state==='ENTER').sort((a,b)=>(b.move.score||0)-(a.move.score||0));
  if(enter.length) return enter[0].vertical;
  return ([...pool].sort((a,b)=>((b.move&&b.move.score)||0)-((a.move&&a.move.score)||0))[0]||{}).vertical||'';
}

  return ['ATLAS CAMPAIGN EXPORT · '+(brief.snapshot_date||SNAPSHOT),'Lane: '+vertical,'',

const hasCopy=(c)=>!!(c&&c.concept&&(c.concept.headline||c.concept.hook));

/** Live lanes first (focus, then fresh). The focus card renders open; every other live lane is one folded line
    ({lane} · {state} {angle} ({score}/100) · {concept}); the concept-{v} id stays on the card inside the fold, so
    "View campaign" opens it. Older campaigns with real copy go under one more fold.
    The 7 shipped creatives do NOT depend on this — they are the Examples gallery below. */
function renderConceptSection(d, focusVertical){
  const concepts=d.concepts||{}, shipCfg=d.ship||{};
  const briefByV={}; for(const v of ((d.brief&&d.brief.verticals)||[])) briefByV[v.vertical]=v;
  const live=[...new Set([focusVertical,...freshList(d)].filter(Boolean))];
  const fold=(v,card)=>{
    const c=concepts[v], mv=(c&&c.move&&c.move.state)?c.move:((briefByV[v]&&briefByV[v].move)||{});
    const name=c&&c.concept&&c.concept.concept_name;
    const sum=esc(laneName(v))+(mv.state?' · <span class="badge '+esc(mv.state)+'">'+esc(mv.state)+'</span> '+esc(label(mv.angle))+(mv.score!=null?' ('+mv.score+'/100)':''):'')+(name?' · '+esc(name):'');
    return '<details class="cfold"'+fk('c|'+v)+'><summary><span>'+sum+'</span></summary>'+card+'</details>';
  };
  const html=live.map((v,i)=>{
    const card=concepts[v]?conceptCardHtml(concepts[v],shipCfg):conceptPendingHtml(v,briefByV[v]&&briefByV[v].move);
    return i===0?card:fold(v,card);
  });
  const older=Object.keys(concepts).filter(v=>!live.includes(v)&&hasCopy(concepts[v]));
  if(older.length) html.push('<details class="older"'+fk('oc')+'><summary>'+esc(t('olderCampaigns'))+' ('+older.length+')</summary>'+older.map(v=>conceptCardHtml(concepts[v],shipCfg)).join('')+'</details>');
  return html.join('')||'<div class="loading">—</div>';
}

let refreshPollTimer=null;

    },20000);
  }
}

/* Owner only. The public never starts a capture — there is no ?track=1 auto-run any more. */
function runTrack(){

  scanFeed('start',t('addingRadar'));

  es.onmessage=(m)=>{

    scanFeed(e.stage,e.message||'', e.stage==='error'?'bad':'ok');
    if(e.stage&&e.stage!=='error'&&e.stage!=='done') setTrackRunning(true,stageLabel(e.stage));

    }

/** Mobile SSE drops (screen sleep) while the server keeps rendering — poll until the asset lands. */
function pollShipAfterDisconnect(vertical, ctx){
  const startMs=Date.now(), MAX_MS=660000, INTERVAL=8000;
  shipFeed(vertical,'poll',t('reconnect'),'ok');
  async function attempt(){
    if(ctx.shipDoneRef.done) return;
    if(Date.now()-startMs>MAX_MS){ shipFeed(vertical,'error','stream closed','bad'); shipBusyVertical=''; setShipButtons(false); return; }
    try{
      const d=await (await fetch(atlasUrl())).json();
      const c=(d.concepts||{})[vertical]||{};
      const hasAssetNow=!!(c.asset&&c.asset.image_file), hasVideoNow=!!(c.video&&c.video.video_file);
      if(hasVideoNow&&!ctx.hadVideo){ ctx.shipDoneRef.done=true; shipBusyVertical=''; finishShipSuccess(d, vertical, false, ctx.videoNote); return; }
      if(ctx.stage==='all'&&hasAssetNow&&!ctx.hadAsset) shipFeed(vertical,'poll',t('stillReady'),'ok');
    }catch{}
    setTimeout(attempt, INTERVAL);
  }
  attempt();
}
function runShip(vertical){
  if(shipBusyVertical||!vertical||!IS_OWNER()) return;
  const c=ATLAS_DATA&&ATLAS_DATA.concepts&&ATLAS_DATA.concepts[vertical];
  const hasAsset=!!(c&&c.asset&&c.asset.image_file), hasVideo=!!(c&&c.video&&c.video.video_file);
  const stage=hasAsset&&!hasVideo?'video':'all';
  shipBusyVertical=vertical; setShipButtons(true, vertical);
  const feedEl=document.getElementById('shipfeed-'+vertical); if(feedEl) feedEl.innerHTML='';
  shipFeed(vertical,'start',stage==='video'?'Animating 5s video…':'Rendering still, then video…','ok');
  const shipDoneRef={done:false}; let videoNote='';
  const es=new EventSource(withToken('api/atlas/ship?vertical='+encodeURIComponent(vertical)+'&stage='+stage));
  es.onmessage=(m)=>{
    let e; try{e=JSON.parse(m.data);}catch{return;}
    if(e.stage==='video'&&(e.partial||e.message)) videoNote=e.message||videoNote;
    shipFeed(vertical, e.stage, e.message||'', e.stage==='error'?'bad':'ok');
    if(e.stage==='done'){
      shipDoneRef.done=true; es.close(); shipBusyVertical='';
      const partial=e.video_status==='partial'||(!e.has_video&&hasAsset);
      fetch(atlasUrl()).then(r=>r.json()).then(d=>finishShipSuccess(d, vertical, partial, videoNote));
    }
    if(e.stage==='error'){ shipDoneRef.done=true; es.close(); shipBusyVertical=''; setShipButtons(false); }
  };
  const lost=()=>{ es.close(); if(!shipDoneRef.done&&shipBusyVertical===vertical) pollShipAfterDisconnect(vertical,{stage,hadAsset:hasAsset,hadVideo:hasVideo,videoNote,shipDoneRef}); };
  es.addEventListener('close',lost);
  es.onerror=()=>{ if(!shipDoneRef.done) lost(); };
}
function bindShipButtons(){ document.querySelectorAll('.shipbtn').forEach(btn=>{ btn.onclick=()=>runShip(btn.dataset.v); }); }

$('scanTrack').onclick=runTrack;
$('scanQ').addEventListener('keydown',e=>{ if(e.key==='Enter'&&IS_OWNER()) runTrack(); });
const qParam=URLP.get('q'); if(qParam) $('scanQ').value=qParam;
if(URLP.get('track')==='1'){ // old WHITESPACE links land on the request form
  history.replaceState(null,'',qParam?'atlas.html?q='+encodeURIComponent(qParam):'atlas.html');
  setTimeout(()=>$('scan').scrollIntoView({behavior:'smooth',block:'start'}),300);
}

async function render(d){
  ATLAS_DATA=d;
  SNAPSHOT=d.snapshot_date||'';
  paintScanBox();
  const pipe=d.pipeline||{}, refreshing=!!pipe.in_progress;
  const fresh=freshList(d);
  // Days tracked = days since the FIRST capture (25 Jun 2026), counted to today in Panamá: it grows by itself.
  const since=d.first_snapshot_date||'2026-06-25';
  let today=''; try{ today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Panama'}).format(new Date()); }catch(e){ today=new Date().toISOString().slice(0,10); }
  const daysTracked=Math.max(0,Math.round((Date.parse(today+'T00:00:00Z')-Date.parse(since+'T00:00:00Z'))/864e5));
  // 3 stats (the latest-snapshot date is in the bar above the header)
  $('stats').innerHTML=[[t('stDays'),daysTracked,'days',t('stDaysTip')(since,d.distinct_days||0)],[t('stAds'),d.total_rows||0,'ads'],[t('stVerts'),fresh.length||(d.board||[]).length,'lanes']]
    .map(([l,n,key,tip])=>'<div class="stat"'+(tip?' title="'+esc(tip)+'"':'')+'>'+
      '<span class="n" data-count="'+(+n||0)+'" data-key="'+key+'">0</span><span class="l">'+esc(l)+'</span></div>').join('');
  Skin.countUp($('stats'),LANG);
  // The bar: one true, current fact, always written (never blank). No date is promised for the next capture.
  const annc=$('annc'), bar=$('refreshBanner');
  const fmtDay=(s,o)=>{ if(!s) return '—'; try{ return new Intl.DateTimeFormat(LANG==='es'?'es-PA':'en-US',Object.assign({day:'numeric',month:'short',timeZone:'UTC'},o||{})).format(new Date(s+'T12:00:00Z')); }catch(e){ return s; } };
  let warn=false;
  if(pipe.stale_reason){ bar.textContent=pipe.stale_reason; warn=true; }
  else if(refreshing){ bar.textContent=t('barUpd')(fmtDay(pipe.expected_snapshot_date||d.snapshot_date)); }
  else if(d.stale){ bar.textContent=t('stale')(d.snapshot_date||'—',d.snapshot_age_days!=null?d.snapshot_age_days:'?'); warn=true; }
  else bar.innerHTML='<span class="l">'+esc(t('barNorm')(fmtDay(d.snapshot_date,{weekday:'short'})))+'</span><span class="s">'+esc(t('barShort')(fmtDay(d.snapshot_date)))+'</span>';
  annc.classList.toggle('warn',warn);
  scheduleRefreshPoll(d);

  // the resilience line is the How section's footnote (its leading "⌐ " dropped)
  $('shrug').textContent=String((d.brief&&d.brief.resilience)||'Atlas shifted — multi-tier LLM failover armed.').replace(/^\s*⌐\s*/,'');
  const focus=pickDefaultVertical(d);
  renderHero(d, focus);
  renderTrackedList(d);

  // "What nobody else shows" (wait cost, half-life, ABSENT angles) now lives inside each lane's card.
  const intel=d.intelligence||{};
  const freshSet=new Set(fresh);
  const intelByV={}; for(const iv of (intel.verticals||[])) intelByV[iv.vertical]=iv;
  const intelHtml=(v)=>{
    const iv=intelByV[v]; if(!iv) return '';
    const wc=iv.wait_cost, hl=iv.half_life;
    // BUILD NOW / WAIT answers the board's question in a second vocabulary: owner-only (D4)
    const pills=((IS_OWNER()&&wc)?('<span class="pill '+(wc.verdict==='BUILD NOW'?'now':wc.verdict==='WAIT'?'wait':'avoid')+'">'+esc(wc.verdict)+'</span>'):'')+
      (hl?('<span class="pill fresh">~'+hl.est_days_remaining+t('halfLife')+' · '+hl.opportunity_remaining_pct+t('room')+'</span>'):'');
    const absent=(iv.absent_universe||[]).slice(0,2).map(a=>'<div class="absent"><b>'+t('absent')+' · '+esc(label(a.angle_id))+'</b> — '+esc(a.opportunity)+(a.adjacent_heat?' ('+t('demandNearby')+': '+esc(a.adjacent_heat)+')':'')+'</div>').join('');
    const body=(pills?'<div class="intelrow">'+pills+'</div>':'')+(wc?('<div class="note">'+t('waitCost')+': '+esc(wc.reason)+'</div>'):'')+absent;
    return body?'<details class="more"'+fk('m|'+v)+'><summary>'+esc(t('moreIntel'))+'</summary>'+body+'</details>':'';
  };
  const sigBasis=(s)=>{ const k='sb_'+s; return (I18N[LANG]&&I18N[LANG][k])||I18N.en[k]||String(s||''); };

  // Board: live lanes (≤14 days) first, each a fold; the rest under "Older lanes". History calls run in parallel.
  const briefByV={}; for(const v of ((d.brief&&d.brief.verticals)||[])) briefByV[v.vertical]=v;
  const histOf=async(v,a)=>{ try{ const r=await fetch('api/atlas/history?vertical='+encodeURIComponent(v)+'&angle='+encodeURIComponent(a)); return (await r.json()).history||[]; }catch{ return []; } };
  const board=[...(d.board||[])].sort((a,b)=>(fresh.indexOf(a.vertical)<0?99:fresh.indexOf(a.vertical))-(fresh.indexOf(b.vertical)<0?99:fresh.indexOf(b.vertical)));
  const wide=!window.matchMedia||matchMedia('(min-width:720px)').matches;
  let liveIdx=0;
  const cards=await Promise.all(board.map(async v=>{
    const mv=briefByV[v.vertical];
    const moveTxt=mv&&mv.move?(t('moveLab')+' → '+esc(mv.move.state)+' '+esc(label(mv.move.angle))+' ('+mv.move.score+'/100)'):'';
    const isFresh=freshSet.has(v.vertical);
    const hs=await Promise.all(v.angles.map(a=>isFresh?histOf(v.vertical,a.angle_id):Promise.resolve([])));
    const lanes=v.angles.map((a,i)=>'<div class="lane" data-v="'+esc(v.vertical)+'" data-a="'+esc(a.angle_id)+'" data-d="'+esc(v.snapshot_date||'')+'">'+
      '<span class="badge '+esc(a.window_state)+'">'+esc(a.window_state)+'</span>'+
      '<span class="angle">'+esc(label(a.angle_id))+' <span class="b">'+a.distinct_advertisers+' '+t(+a.distinct_advertisers===1?'adv1':'advs')+' · '+esc(sigBasis(a.signal_basis))+(a.adjacency_note?(' · '+esc(trWhy(a.adjacency_note))):'')+'</span></span>'+
      sparkSvg(hs[i])+'<span class="satbar"><span class="satfill" style="width:'+pct(a.saturation)+'%"></span></span><span class="score">'+pct(a.window_score)+'</span></div>').join('');
    const head='<span class="vname">'+esc(laneName(v.vertical))+' <span class="datepill'+(isFresh?' fresh':'')+'">'+esc(v.snapshot_date||'')+'</span></span><span class="vmove">'+moveTxt+'</span>';
    if(!isFresh) return {fresh:false, v:v.vertical, html:'<div class="card vcard"><div class="vhead">'+head+'</div>'+lanes+'</div>'};
    return {fresh:true, v:v.vertical, head, body:lanes+intelHtml(v.vertical)};
  }));
  const boardEl=$('board');
  // open: what the visitor opened or closed (kept across the 20s refresh poll and a language switch); else wide
  // screens open every live lane, phones only the first
  const live=cards.filter(c=>c.fresh).map(c=>{
    const open=laneOpen.has(c.v)?laneOpen.get(c.v):(wide||liveIdx===0); liveIdx++;
    return '<details class="card vcard lanefold" data-v="'+esc(c.v)+'"'+(open?' open':'')+'><summary class="vhead">'+c.head+'</summary>'+c.body+'</details>';
  }).join('');
  const old=cards.filter(c=>!c.fresh).map(c=>c.html).join('');
  boardEl.innerHTML=(live||'')+(old?'<details class="older"'+fk('ol')+'><summary>'+esc(t('olderLanes'))+'</summary>'+old+'</details>':'')||'<div class="loading">'+t('noRadar')+'</div>';
  if(!board.length) boardEl.innerHTML='<div class="loading">'+t('noRadar')+'</div>';
  boardEl.querySelectorAll('.lane').forEach(el=>el.onclick=()=>openEvidence(el.dataset.v, el.dataset.a, el.dataset.d));
  boardEl.querySelectorAll('details.lanefold').forEach(det=>det.addEventListener('toggle',()=>laneOpen.set(det.dataset.v,det.open)));
  if((d.distinct_days||0)<2) boardEl.insertAdjacentHTML('beforeend','<div class="note">'+t('sparkNote')+'</div>');
  if(board.length&&!(intel.verticals||[]).length) boardEl.insertAdjacentHTML('beforeend','<div class="note">'+t('intelPending')+'</div>');

  $('concepts').innerHTML=renderConceptSection(d, focus);
  bindShipButtons();
  document.querySelectorAll('#board details[data-k], #concepts details[data-k]').forEach(det=>det.addEventListener('toggle',()=>foldOpen.set(det.dataset.k,det.open)));

  // Market memory: the same call logged on several days is ONE row (date|lane|angle), newest first.
  const seen=new Set();
  const mem=(intel.memory||[]).filter(m=>{ const k=m.snapshot_date+'|'+m.vertical+'|'+m.angle_id; if(seen.has(k)) return false; seen.add(k); return true; })
    .sort((a,b)=>String(b.snapshot_date).localeCompare(String(a.snapshot_date)));
  $('memCount').textContent=String(mem.length);
  $('memory').innerHTML=mem.length?mem.slice(0,12).map(m=>'<div class="memory">'+esc(m.snapshot_date)+' · '+esc(laneName(m.vertical))+' · ENTER <b>'+esc(label(m.angle_id))+'</b> ('+Math.round(m.window_score*100)+'/100)</div>').join(''):'<div class="note">'+t('memNone')+'</div>';
}

function setLang(l){ LANG=l; try{localStorage.setItem('atlas_lang',l)}catch{} applyStaticLang(); if(ATLAS_DATA) render(ATLAS_DATA); }
applyStaticLang();
if(!window.__wsFwd) fetch(atlasUrl()).then(r=>r.json()).then(render).catch(e=>{
  LOAD_FAILED=true;
  $('board').innerHTML='<div class="loading">'+t('failed')+': '+esc(e.message)+'</div>';
  $('heroLoad').textContent=t('noRadar'); $('refreshBanner').textContent=t('noRadar');
});
Skin.backdrop(['ws-night','ws-city-night-grid','ws-casco-skyline','ws-medellin-cathedral','ws-banking-towers','ws-monserrate','ws-panama-skyline','ws-city-night-towers']);
Skin.lightField();
Skin.music('media/atlas-music');
Skin.whatsapp({page:'atlas',prefill:WA_PREFILL});
Skin.hubspot();
Skin.footer('atlas');
</script>

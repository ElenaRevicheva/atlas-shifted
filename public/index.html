    const m=MARKETS[+b.dataset.i]; pickedMarket=+b.dataset.i;
    $('q').value=m[LANG]; countrySel.value=m.country; paintChips(); $('q').focus();
  });

function applyLang(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  const set=(id,k,html)=>{const el=$(id); if(el) el[html?'innerHTML':'textContent']=t(k||id);};
  set('navAtlas'); set('kicker'); set('h1',0,1); set('sub',0,1); set('honest');
  $('modeCt').innerHTML=t('modeCt'); $('modeMb').innerHTML=t('modeMb');
  set('go'); set('fine',0,1); set('recLab');
  ['hAdcopy','hLp','hBlog','hSocial','hHub','hLanes','hAlts','hEv','trackEyebrow','exEyebrow','exLede','tiersEyebrow','tiersLede','howEyebrow','how1','how2','how3','finalP','finalBtn','fTools','fPortfolio','fFilm'].forEach(k=>set(k));
  ['exH','tiersH','finalH'].forEach(k=>set(k,0,1));
  $('finalBtn').href=PAY+LANG;
  Skin.ticker($('ticker'),t('ticker'));
  $('langEN').classList.toggle('on',LANG==='en'); $('langES').classList.toggle('on',LANG==='es');
  paintChips(); paintTiers();
  Skin.examples($('reels'),LANG);
  if(lastQuery) paintTrack();
}
function setLang(l){ LANG=l; try{localStorage.setItem('ws_lang',l)}catch{} applyLang(); }

$('langES').onclick=()=>setLang('es');

document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{

});

let running=false, lastQuery='', lastCountry='PA';
function run(){
  if(running) return;
  const v=$('q').value.trim();
  if(!v){ $('q').focus(); return; }
  lastQuery=v; lastCountry=countrySel.value;
  running=true; $('go').disabled=true;
  $('status').style.display='block'; $('results').style.display='none'; $('quotaLead').style.display='none';
  $('feed').innerHTML=''; $('fill').style.width='0%';
  feed('start',t('connecting'));
  const es=new EventSource('api/run?vertical='+encodeURIComponent(v)+'&mode='+encodeURIComponent(mode)+'&country='+encodeURIComponent(lastCountry)+(OWNER_TOKEN?'&token='+encodeURIComponent(OWNER_TOKEN):''));
  es.onmessage=(m)=>{
    let e; try{e=JSON.parse(m.data);}catch{return;}
    if(typeof e.pct==='number') $('fill').style.width=e.pct+'%';
    if(e.stage==='done'&&e.data){ feed(e.stage,e.message); render(e.data); es.close(); finish(); return; }
    if(e.stage==='error'){
      es.close(); finish();
      if(e.code==='quota'||e.code==='quota_global'){ showQuota(e.code); return; }
      feed('error',e.message); return;
    }
    feed(e.stage,e.message);
  };
  es.addEventListener('close',()=>{es.close();finish();});
  es.onerror=()=>{ if(running){feed('error',t('streamClosed'));} es.close(); finish(); };
}
function finish(){ running=false; $('go').disabled=false; }
function feed(stage,msg){
  const d=document.createElement('div');
  d.innerHTML='<span class="'+(stage==='error'?'er':'st')+'">'+esc(stage)+'</span> · '+esc(msg);
  $('feed').appendChild(d); $('feed').scrollTop=$('feed').scrollHeight;
}
function showQuota(code){
  $('status').style.display='none';
  const box=$('quotaLead'); box.style.display='block';
  Skin.leadForm(box,{kind:'scan_quota',lang:LANG,intro:t(code==='quota_global'?'quotaGlobalIntro':'quotaIntro')+' <a href="'+PAY+LANG+'" target="_blank" rel="noopener">$100 →</a>',market:()=>lastQuery,country:()=>lastCountry});
}
function paintTrack(){
  $('trackH').innerHTML=t('trackH');
  const tm=$('trackMarket'); if(tm) tm.textContent=lastQuery;
  Skin.leadForm($('trackLead'),{kind:'weekly_tracking',lang:LANG,intro:esc(t('trackIntro')),market:()=>lastQuery,country:()=>lastCountry});
}

function render(p){
  $('results').style.display='block';
  const r=p.recommendation||{};
  $('recAngle').textContent=r.angle||'—';
  $('recRationale').textContent=r.rationale||'';
  $('recConf').innerHTML=t('confidence')+' <b>'+(r.confidence||0)+'</b>/100 · '+t('owns')+' <b>'+esc(r.emotion||'—')+'</b> · '+esc(r.hookType||'');
  $('recAdj').innerHTML=(r.adjacentTo&&r.adjacentTo.length)?(t('borrows')+' <b>'+r.adjacentTo.map(esc).join('</b>, <b>')+'</b>'):'';
  const cb=$('cachedBadge');
  if(p.cached&&p.cached.at){ cb.textContent='↺ '+t('cached')+' '+String(p.cached.at).slice(0,10)+' · '+lastCountry; cb.style.display='inline-block'; } else cb.style.display='none';

  const isContent=p.kind==='content';
  document.querySelectorAll('.results .only-mb').forEach(el=>el.style.display=isContent?'none':'block');
  document.querySelectorAll('.results .only-ct').forEach(el=>el.style.display=isContent?'block':'none');

  if(!isContent){
    $('adcopy').innerHTML=(p.adCopy||[]).filter(Boolean).map(c=>'<div class="card tile"><h3>'+esc(c.headline)+'</h3><div class="ct">'+esc(c.primaryText)+'</div><span class="ctag">'+esc(c.cta)+'</span></div>').join('')||'<div class="ct">—</div>';
    const lp=p.landingPage||{};
    $('lp').innerHTML='<h3>'+esc(lp.hook||'—')+'</h3><div class="ct">'+esc(lp.subhead||'')+'<br><br><span style="color:var(--dim)">'+t('hero')+':</span> '+esc(lp.heroConcept||'')+'</div>';
  } else {
    const b=p.blog||{};
    $('blog').innerHTML='<h3>'+esc(b.title||'—')+'</h3><div class="ct"><span style="color:var(--dim)">'+t('keyword')+':</span> '+esc(b.targetKeyword||'')+'<br><br>'+
      (b.outline||[]).map(o=>'• '+esc(o)).join('<br>')+'<br><br><span style="color:var(--dim)">AEO:</span> '+esc(b.aeoHint||'')+'</div>';
    const s=p.social||{};
    $('social').innerHTML='<div class="card tile"><h3>LinkedIn</h3><div class="ct">'+esc(s.linkedin||'').replace(/\n/g,'<br>')+'</div></div>'+
      '<div class="card tile"><h3>Instagram</h3><div class="ct">'+esc(s.instagram||'')+'</div></div>'+
      '<div class="card tile"><h3>'+t('xhook')+'</h3><div class="ct">'+esc(s.xThreadHook||'')+'</div></div>';
    $('hub').innerHTML='<div class="ct">'+esc(p.hubspotCampaignAngle||'—')+'</div>';
  }
  $('lanes').innerHTML=(p.crowdedLanes||[]).map(l=>'<div class="lane"><span class="sat '+esc(l.saturation)+'">'+esc(l.saturation)+'</span><span class="ang">'+esc(l.angle)+' <span style="color:var(--dim)">('+(l.creativeCount||0)+')</span></span><span class="em">'+esc(l.dominantEmotion||'')+'</span></div>').join('')||'<div class="ct">—</div>';
  const alts=p.alternativeBets||[];
  $('altSec').style.display=alts.length?'block':'none';
  $('alts').innerHTML=alts.map(a=>'<div class="alt"><b>'+esc(a.angle)+'</b> <span class="c">'+(a.confidence||0)+'</span><br>'+esc(a.rationale)+'</div>').join('');
  $('evidence').innerHTML=(p.evidence||[]).map(e=>'<div class="ev"><b>'+esc(e.advertiser||'unknown')+'</b> — '+esc(e.insight)+'<br>'+(e.sourceUrl?('<a href="'+esc(e.sourceUrl)+'" target="_blank" rel="noopener">'+esc(String(e.sourceUrl).slice(0,72))+'</a>'):'')+'</div>').join('')||'<div class="ct">'+t('noEvidence')+'</div>';
  const m=p.meta||{};
  $('meta').textContent=t('scanned')+' '+(m.creativesScanned||0)+' '+t('creatives')+' · '+((m.sources&&m.sources.join(' + '))||'knowledge mode')+' · '+(m.llmProvider||'')+(p.cached?'':' · '+(m.durationMs||0)+' ms')+(m.degraded?' · DEGRADED':'');
  const deg=$('deg');
  if(m.degraded&&m.notes&&m.notes.length){ deg.style.display='block'; deg.textContent='⚠ '+m.notes.join('  '); } else deg.style.display='none';
  paintTrack();
  $('results').scrollIntoView({behavior:'smooth',block:'start'});
}

$('go').onclick=run;
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter') run(); });
$('q').addEventListener('input',()=>{ if(pickedMarket!==null){ pickedMarket=null; paintChips(); } });
applyLang();
Skin.backdrop(['ws-catamaran','ws-cartagena','ws-casco-viejo','ws-beach-boats','ws-sunset-real']);
</script>
</body>
</html>
